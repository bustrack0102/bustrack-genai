name: CD Azure Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install -r requirements.txt
          black --check src UnitTest GuardrailTest IntegrationTest SecurityTest
          flake8 src UnitTest GuardrailTest IntegrationTest SecurityTest
          pytest -q
          pwsh -File scripts/check_sdd.ps1
      - uses: semgrep/semgrep-action@v1
        with:
          config: .semgrep/rules/semgrep.yaml

  deploy-azure:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push bustrack-genai to ACR
        run: |
          ACR_NAME=bustrackacr0102
          az acr update --name "$ACR_NAME" --admin-enabled true -o none
          ACR_LOGIN_SERVER=$(az acr show -n $ACR_NAME --query loginServer -o tsv)
          ACR_USERNAME=$(az acr credential show -n $ACR_NAME --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show -n $ACR_NAME --query passwords[0].value -o tsv)
          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" --username "$ACR_USERNAME" --password-stdin
          SHORT_SHA="${GITHUB_SHA::12}"
          TAG="${ACR_LOGIN_SERVER%/}/bustrack-genai:0.2.0-${SHORT_SHA}"
          TAG_LATEST="${ACR_LOGIN_SERVER%/}/bustrack-genai:latest"
          docker build -t "$TAG" -t "$TAG_LATEST" -f Dockerfile .
          docker push "$TAG"
          docker push "$TAG_LATEST"
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "ACR_LOGIN_SERVER=$ACR_LOGIN_SERVER" >> $GITHUB_ENV
          echo "ACR_USERNAME=$ACR_USERNAME" >> $GITHUB_ENV
          echo "ACR_PASSWORD=$ACR_PASSWORD" >> $GITHUB_ENV

      - name: Deploy bustrack-genai (Container App if present, otherwise ACI)
        run: |
          if az containerapp show -g rg-bustrack-ncus -n bustrack-genai -o none 2>/dev/null; then
            az containerapp secret set -g rg-bustrack-ncus -n bustrack-genai \
              --secrets internal-key="${{ secrets.INTERNAL_SERVICE_KEY }}" -o none
            az containerapp update -g rg-bustrack-ncus -n bustrack-genai \
              --image "$IMAGE_TAG" \
              --set-env-vars INTERNAL_SERVICE_CREDENTIAL=secretref:internal-key -o none
          else
            az container create \
              --resource-group rg-bustrack-ncus \
              --name bustrack-genai \
              --image "$IMAGE_TAG" \
              --registry-login-server "$ACR_LOGIN_SERVER" \
              --registry-username "$ACR_USERNAME" \
              --registry-password "$ACR_PASSWORD" \
              --dns-name-label bustrack-genai-uttt \
              --ports 8000 \
              --os-type Linux \
              --cpu 0.5 \
              --memory 1.0 \
              --secure-environment-variables INTERNAL_SERVICE_CREDENTIAL="${{ secrets.INTERNAL_SERVICE_KEY }}" -o none
            for i in $(seq 1 20); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://bustrack-genai-uttt.northcentralus.azurecontainer.io:8000/health || echo "000")
              [ "$CODE" -eq 200 ] && exit 0
              sleep 10
            done
            exit 1
          fi
